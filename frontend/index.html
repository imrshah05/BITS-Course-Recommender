<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="BITS Academic Course Recommender dashboard">
    <title>BITS Academic Course Recommender</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="BITS Academic Course Recommender home">
        <span class="brand-mark" aria-hidden="true">B</span>
        <span>BITS Academic Course Recommender</span>
      </a>
      <span id="api-status" class="status" role="status">Connecting…</span>
    </header>

    <main class="dashboard-shell">
      <section class="hero" aria-labelledby="dashboard-title">
        <p class="eyebrow">Dashboard foundation</p>
        <h1 id="dashboard-title">Plan courses with academic rules in view.</h1>
        <p class="hero-copy">
          The dashboard connection is ready. Student planning and recommendation
          workflows will be added in later tasks.
        </p>
      </section>

      <section class="foundation-card" aria-labelledby="connection-title">
        <div>
          <p class="card-label">Backend connection</p>
          <h2 id="connection-title">API service</h2>
        </div>
        <p id="connection-detail">Checking the local service…</p>
      </section>
    </main>

    <script src="/assets/app.js" defer></script>
  </body>
</html>
